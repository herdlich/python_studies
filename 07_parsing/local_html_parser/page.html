<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tech Store</title>
</head>
<body>
    <header>
        <h1>Tech Store</h1>
        <p class="subtitle">Best gadgets for developers</p>
    </header>

    <main>
        <section class="products">

            <div class="product-card" data-id="1">
                <h2 class="product-title">Mechanical Keyboard</h2>
                <p class="category">Keyboards</p>
                <p class="price">4500</p>
                <p class="stock">In stock</p>
                <a class="product-link" href="/products/mechanical-keyboard">View product</a>
            </div>

            <div class="product-card" data-id="2">
                <h2 class="product-title">Wireless Mouse</h2>
                <p class="category">Mice</p>
                <p class="price">2200</p>
                <p class="stock">In stock</p>
                <a class="product-link" href="/products/wireless-mouse">View product</a>
            </div>

            <div class="product-card" data-id="3">
                <h2 class="product-title">USB-C Hub</h2>
                <p class="category">Accessories</p>
                <p class="price">3100</p>
                <p class="stock">Out of stock</p>
                <a class="product-link" href="/products/usb-c-hub">View product</a>
            </div>

            <div class="product-card" data-id="4">
                <h2 class="product-title">Portable Monitor</h2>
                <p class="category">Monitors</p>
                <p class="price">15500</p>
                <p class="stock">In stock</p>
                <a class="product-link" href="/products/portable-monitor">View product</a>
            </div>

        </section>
    </main>
</body>
</html>
