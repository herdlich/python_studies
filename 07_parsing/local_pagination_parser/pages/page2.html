<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tech Store</title>
</head>
<body>
    <header>
        <h1>Tech Store</h1>
        <p class="subtitle">Best gadgets for developers</p>
    </header>

    <main>
        <section class="products">

            <div class="product-card" data-id="5">
                <h2 class="product-title">Laptop Stand</h2>
                <p class="category">Accessories</p>
                <p class="price">2700</p>
                <p class="stock">In stock</p>
                <a class="product-link" href="/products/laptop-stand">View product</a>
            </div>

            <div class="product-card" data-id="6">
                <h2 class="product-title">Noise Cancelling Headphones</h2>
                <p class="category">Audio</p>
                <p class="price">8900</p>
                <p class="stock">In stock</p>
                <a class="product-link" href="/products/noise-cancelling-headphones">View product</a>
            </div>

            <div class="product-card" data-id="7">
                <h2 class="product-title">Webcam Full HD</h2>
                <p class="category">Cameras</p>
                <p class="price">4200</p>
                <p class="stock">Out of stock</p>
                <a class="product-link" href="/products/webcam-full-hd">View product</a>
            </div>

            <div class="product-card" data-id="8">
                <h2 class="product-title">Desk Lamp</h2>
                <p class="category">Office</p>
                <p class="price">1800</p>
                <p class="stock">In stock</p>
                <a class="product-link" href="/products/desk-lamp">View product</a>
            </div>

        </section>
    </main>
</body>
</html>
