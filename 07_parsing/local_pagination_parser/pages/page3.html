<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tech Store</title>
</head>
<body>
    <header>
        <h1>Tech Store</h1>
        <p class="subtitle">Best gadgets for developers</p>
    </header>

    <main>
        <section class="products">

            <div class="product-card" data-id="9">
                <h2 class="product-title">External SSD 1TB</h2>
                <p class="category">Storage</p>
                <p class="price">7600</p>
                <p class="stock">In stock</p>
                <a class="product-link" href="/products/external-ssd-1tb">View product</a>
            </div>

            <div class="product-card" data-id="10">
                <h2 class="product-title">Gaming Chair</h2>
                <p class="category">Furniture</p>
                <p class="price">19900</p>
                <p class="stock">Out of stock</p>
                <a class="product-link" href="/products/gaming-chair">View product</a>
            </div>

            <div class="product-card" data-id="11">
                <h2 class="product-title">Ethernet Cable</h2>
                <p class="category">Networking</p>
                <p class="price">600</p>
                <p class="stock">In stock</p>
                <a class="product-link" href="/products/ethernet-cable">View product</a>
            </div>

            <div class="product-card" data-id="12">
                <h2 class="product-title">Smart Speaker</h2>
                <p class="category">Audio</p>
                <p class="price">5400</p>
                <p class="stock">In stock</p>
                <a class="product-link" href="/products/smart-speaker">View product</a>
            </div>

        </section>
    </main>
</body>
</html>
